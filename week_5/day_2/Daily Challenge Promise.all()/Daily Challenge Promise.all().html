<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Challenge: Promise.all()</title>
</head>
<body>
    <h1>Daily Challenge: Promise.all()</h1>
    <form id="sunrise-form">
        <h2>City 1</h2>
        <label for="lat1">Latitude:</label>
        <input type="text" id="lat1" placeholder="e.g., 48.864716" required><br>
        <label for="lng1">Longitude:</label>
        <input type="text" id="lng1" placeholder="e.g., 2.349014" required><br>

        <h2>City 2</h2>
        <label for="lat2">Latitude:</label>
        <input type="text" id="lat2" placeholder="e.g., 40.730610" required><br>
        <label for="lng2">Longitude:</label>
        <input type="text" id="lng2" placeholder="e.g., -73.935242" required><br>

        <button type="button" id="get-sunrise">Get Sunrise Times</button>
    </form>
    <div id="results"></div>

    <script src="Daily Challenge Promise.all().js"></script>
</body>
</html>
