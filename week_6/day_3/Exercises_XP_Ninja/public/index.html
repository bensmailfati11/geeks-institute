<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Quiz Game</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Question:</span>
                    <span id="current-question">0</span> / <span id="total-questions">0</span>
                </div>
                <div class="stat">
                    <span class="label">Score:</span>
                    <span id="score">0</span>
                </div>
                <div class="stat" id="timer-container" style="display: none;">
                    <span class="label">Time:</span>
                    <span id="timer">30</span>s
                </div>
            </div>
        </header>

        <main>
            <!-- Start Screen -->
            <div id="start-screen" class="screen active">
                <h2>Welcome to the Quiz Game!</h2>
                <p>Test your knowledge with multiple-choice questions.</p>
                <button id="start-btn" class="btn btn-primary">Start Quiz</button>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="screen">
                <div class="question-container">
                    <h2 id="question-text">Question will appear here</h2>
                    <div id="options-container" class="options"></div>
                    <div id="feedback" class="feedback"></div>
                    <button id="next-btn" class="btn btn-primary" style="display: none;">Next Question</button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="results-screen" class="screen">
                <h2>Quiz Complete! 🎉</h2>
                <div class="results">
                    <div class="result-item">
                        <span class="result-label">Final Score:</span>
                        <span id="final-score" class="result-value">0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Correct Answers:</span>
                        <span id="correct-answers" class="result-value">0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Total Questions:</span>
                        <span id="total-answered" class="result-value">0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Percentage:</span>
                        <span id="percentage" class="result-value">0%</span>
                    </div>
                </div>
                <div id="performance-message" class="performance-message"></div>
                <button id="restart-btn" class="btn btn-primary">Play Again</button>
            </div>
        </main>

        <footer>
            <p>Made with ❤️ for learning</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
